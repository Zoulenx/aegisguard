name: Build AegisGuard (Windows + Android APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Run Go unit tests
        working-directory: windows
        run: go test -v ./...
      - name: Cross-compile Windows x64 binaries
        working-directory: windows
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/aegisguard.exe ./cmd/aegisguard
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/aegisguard-watchdog.exe ./cmd/aegisguard-watchdog
          zip -r ../AegisGuard-Windows-x64.zip dist browser-extension scripts ../README.md
      - uses: actions/upload-artifact@v4
        with:
          name: AegisGuard-Windows-x64
          path: AegisGuard-Windows-x64.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android APK (Debug installable + Signed Release)
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../AegisGuard-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AegisGuard-Android-APK
          path: AegisGuard-Android.apk

  publish-release:
    needs: [ build-windows, build-android ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.0.0 release-assets/* -R "${{ github.repository }}" --clobber
          else
            gh release create v1.0.0 release-assets/* \
              -R "${{ github.repository }}" \
              --title "AegisGuard v1.0.0 (Windows + Android APK)" \
              --notes "Incluye AegisGuard-Android.apk listo para instalar en tu móvil Android y AegisGuard-Windows-x64.zip listo para instalar en Windows."
          fi
