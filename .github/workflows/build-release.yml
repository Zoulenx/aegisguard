name: Build AegisGuard v1.1 (Windows AI + Android AI APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run Go unit tests (DNS, Semantic Filter, Locker, Vision AI)
        working-directory: windows
        run: go test -v ./...
      - name: Build Windows core and watchdog binaries
        working-directory: windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\models | Out-Null
          go build -ldflags="-s -w" -o dist\aegisguard.exe .\cmd\aegisguard
          go build -ldflags="-s -w" -o dist\aegisguard-watchdog.exe .\cmd\aegisguard-watchdog
      - name: Build Windows local ONNX ResNet-50 Vision AI sidecar
        working-directory: windows
        shell: pwsh
        run: |
          dotnet publish vision-ai\AegisVisionAI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o vision-ai\out
          Copy-Item -Force vision-ai\out\aegisguard-ai.exe dist\aegisguard-ai.exe
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/FaceONNX/NsfwONNX/main/netstandard/NsfwONNX/models/resnet_50_1by2_nsfw.onnx" -OutFile "dist\models\resnet_50_1by2_nsfw.onnx"
          if ((Get-Item "dist\models\resnet_50_1by2_nsfw.onnx").Length -lt 1000000) { throw "ONNX model download invalid" }
      - name: Package AegisGuard Windows x64 v1.1 ZIP
        working-directory: windows
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "stage_win"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force dist $stage\dist
          Copy-Item -Recurse -Force browser-extension $stage\browser-extension
          Copy-Item -Recurse -Force scripts $stage\scripts
          Copy-Item -Force ..\README.md $stage\README.md
          Compress-Archive -Path "$stage\*" -DestinationPath "..\AegisGuard-Windows-x64-v1.1.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AegisGuard-Windows-x64-v1.1
          path: AegisGuard-Windows-x64-v1.1.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle local OpenNSFW TensorFlow Lite model into Android assets
        run: |
          curl -fL "https://raw.githubusercontent.com/devzwy/open_nsfw_android/master/data/nsfw2.tflite" -o android/app/src/main/assets/nsfw.tflite
          ls -lh android/app/src/main/assets/nsfw.tflite
          test $(stat -c%s android/app/src/main/assets/nsfw.tflite) -gt 1000000
      - name: Build Android APK with Embedded TFLite Vision AI
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../AegisGuard-Android-v1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AegisGuard-Android-v1.1-APK
          path: AegisGuard-Android-v1.1.apk

  publish-release:
    needs: [ build-windows, build-android ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release v1.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.1.0 -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.1.0 release-assets/* -R "${{ github.repository }}" --clobber
          else
            gh release create v1.1.0 release-assets/* \
              -R "${{ github.repository }}" \
              --title "AegisGuard v1.1.0 (IA Visual Local en Windows + Android APK)" \
              --notes "Novedades v1.1: IA Visual NSFW 100% local sin nube en ambas plataformas — ResNet-50 ONNX (aegisguard-ai.exe) en Windows + OpenNSFW TensorFlow Lite + MediaProjection en Android."
          fi
